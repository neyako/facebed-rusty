<script type="application/json" data-content-len="71569" data-sjs>{"require":[[[{"__bbox":{"require":[[[{"__bbox":{"result":{"data":{"container_story":{},"created_time":1790059466,"creation_story":{"id":"UzpfSTEwMDA2MzQ3OTA1NDA4MjoxNzQ1NDg2Njg0MjQzOTUwOjE3NDU0ODY2ODQyNDM5NTA="},"message_preferred_body":{"text":"VIỆT NAM CÓ 1.4 TRIỆU THANH NIÊN 3 KHÔNG: KHÔNG VIỆC LÀM, KHÔNG HỌC TẬP, KHÔNG THAM GIA ĐÀO TẠO NGHỀ 📉\n\nTheo Cục Thống kê (Bộ Tài chính), tính đến quý II/2026, tỷ lệ thất nghiệp của thanh niên từ 15-24 tuổi tại Việt Nam lên tới 8,67% - cao gần gấp 4 lần tỷ lệ chung.\n\nĐáng nói hơn, ngay cả khi có việc, 57,5% lao động trẻ vẫn đang mắc kẹt trong những công việc \"phi chính thức\", thiếu bảo hiểm và các chế độ bảo vệ cơ bản. Sức ép từ sự thay đổi của chuỗi cung ứng toàn cầu đang đẩy thanh niên vào thế yếu, ít cơ hội nâng cao kỹ năng và dễ bị tổn thương nhất trước những biến động kinh tế.\n\nLàm sao để người trẻ không chỉ có việc mà còn tìm được bến đỗ an toàn, năng suất và thích ứng được với đường dài?\n\n📌 Đón xem Toạ Độ Việc Làm\n⏰ 16:00 | Chủ nhật hàng tuần | VTV2 & VTVgo\n🔥 Đăng ký tham gia chương trình: 👉🏻 https://docs.google.com/forms/d/e/1FAIpQLSdUlVlTYPYiElFnscHZu4hMxev4WDjbUyS-lGtt9eBHGRCQ8g/viewform\n\n#ToaDoViecLam #VTV2 #HuongNghiep #ThucTrangViecLam #GenZ"},"owner":{"id":"100063479054082","name":"VTV Toạ độ việc làm","profile_picture":{"uri":"https://scontent-sea5-1.xx.fbcdn.net/v/t39.30808-1/774371468_1702816338510985_4478492150445195287_n.jpg"}}}}}}]]]}}]]]}</script>
