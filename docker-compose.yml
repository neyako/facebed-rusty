services:
  facebed:
    image: ghcr.io/neyako/facebed-rusty:latest
    build: .
    container_name: facebed
    restart: unless-stopped
    ports:
      - "9812:9812"
    volumes:
      # YAML config. Required even if empty — see config.example.yaml.
      - ./config.yaml:/facebed/config.yaml:ro
      # Cookies (optional). Cookie-Editor JSON or multi-account format.
      # Drop additional accounts as cookies-<name>.json next to this file and
      # uncomment matching mounts below — each sibling cookies*.json is picked
      # up automatically.
      - ./cookies.json:/facebed/cookies.json:ro
      # - ./cookies-alice.json:/facebed/cookies-alice.json:ro
      # - ./cookies-bob.json:/facebed/cookies-bob.json:ro
    environment:
      RUST_LOG: info
