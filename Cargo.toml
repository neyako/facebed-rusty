[package]
name = "facebed"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "Facebook embed proxy for Discord and other messaging apps."
license = "MIT"

[[bin]]
name = "facebed"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

[dependencies]
arc-swap = "1"
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "matched-path", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time", "fs"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "http2", "multipart", "json", "stream"] }
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

regex = "1"
url = "2"
html-escape = "0.2"
once_cell = "1"
percent-encoding = "2"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
tempfile = "3"
